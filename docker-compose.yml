services:
  fotostream:
    build:
      context: .
      dockerfile: Dockerfile
    image: fotostream:latest
    container_name: fotostream-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - HOST=0.0.0.0
      - DEFAULT_PREFIX=/fotostream
      - DB_PATH=/app/storage/fotostream.db
      - STORAGE_DIR=/app/storage
      - UPLOAD_DIR=/app/storage/uploads
      - BGM_DIR=/app/storage/bgm
      - TRANSCODE_DIR=/app/storage/transcoded
      - MAX_CONCURRENT_JOBS=3
      - MAX_CONCURRENT_STREAMS=10
    volumes:
      - fotostream-data:/app/storage
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os, requests; prefix = os.getenv('DEFAULT_PREFIX', ''); requests.get(f'http://localhost:5000{prefix}/api/status')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

volumes:
  fotostream-data:
    driver: local
